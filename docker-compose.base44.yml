services:
  web:
    image: node:20
    working_dir: /app/react-native-educi
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - EXPO_NO_TELEMETRY=true
      - WATCHPACK_POLLING=true
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        npx expo export --platform web
        exec node serve-prod.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: on-failure
