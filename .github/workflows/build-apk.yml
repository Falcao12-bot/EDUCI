name: Construire et Publier EDUCI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Autoriser Gradle
        run: chmod +x ./gradlew

      - name: Construire le fichier APK
        run: ./gradlew assembleDebug

      - name: Enregistrer l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EDUCI-apk
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Renommer l'APK
        run: |
          mkdir -p release
          find . -path '*/build/outputs/apk/debug/*.apk' -exec cp {} release/EduCI.apk \;

      - name: Créer une Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          files: release/EduCI.apk
          name: EduCI v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          body: |
            📱 Application éducative ivoirienne EduCI
            
            Téléchargez le fichier APK ci-dessous et installez-le sur votre smartphone Android.
            
            **Étapes :**
            1. Téléchargez le fichier `EduCI.apk`
            2. Autorisez l'installation depuis des sources inconnues
            3. Ouvrez le fichier et validez l'installation
          prerelease: false
