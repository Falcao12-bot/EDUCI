name: Déployer l'app web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: react-native-educi
        run: npm install --no-audit --no-fund

      - name: Builder l'app web
        working-directory: react-native-educi
        env:
          EXPO_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npx expo export --platform web

      - name: Préparer pour GitHub Pages
        working-directory: react-native-educi
        run: |
          touch dist/.nojekyll
          # GitHub Pages sert l'app sous /<repo>/ — on convertit les chemins absolus en relatifs
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|"/assets/|"./assets/|g' dist/_expo/static/js/web/*.js

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-native-educi/dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
